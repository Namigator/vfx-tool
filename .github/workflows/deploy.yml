name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: xpodev/site-manager-deploy@v1
        with:
          url: https://ssma-deploy.xpo.dev
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: dist
          site: vfx-tool