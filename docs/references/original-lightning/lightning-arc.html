<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A playable lightning arc spell. Procedural lightning, charged particles and synchronized spatial electrical audio in an empty arena.">
<title>ARC — Lightning spell</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%239cdeff' d='M19 2 6 19h9l-2 11L27 12H17z'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04080f;color:#e6f1ff;font-family:Arial,Helvetica,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}header{position:absolute;top:36px;left:40px;pointer-events:none}header .eyebrow{font-size:12px;letter-spacing:.24em;color:#88a0ba}h1{font-size:42px;font-weight:500;letter-spacing:.13em;margin:10px 0 7px}header p{font-size:14px;color:#9cafc5;margin:0}.status{position:absolute;top:40px;right:40px;display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;color:#9fb3c9}.status i{width:6px;height:6px;background:#97d5ff;border-radius:100%;box-shadow:0 0 12px #6ad0ff}footer{position:absolute;bottom:30px;width:100%;display:flex;flex-direction:column;align-items:center;gap:17px;pointer-events:none}.controls{display:flex;gap:8px;padding:7px;border:1px solid #26374a;background:#0b131dcc;border-radius:13px;backdrop-filter:blur(14px);pointer-events:auto}button{font:14px Arial,sans-serif;border:1px solid transparent;border-radius:8px;padding:13px 18px;min-height:46px;background:transparent;color:#adc0d6;cursor:pointer;transition:background .2s,color .2s}button:hover{background:#1d2d3f;color:#fff}button:focus-visible{outline:2px solid #aadfff;outline-offset:3px}#cast{background:#c4eaff;color:#071725;padding:13px 28px;font-weight:600;box-shadow:0 0 24px #7ccaff15}#cast:hover{background:#e5f6ff}button[aria-pressed=true]{background:#20374b;color:#d3edff}kbd{font:11px Arial;border:1px solid #63849975;border-radius:3px;padding:2px 5px;margin-left:12px}.hint{font-size:12px;letter-spacing:.06em;color:#8298b0}.corner{position:absolute;bottom:35px;left:40px;font-size:12px;color:#61768c;letter-spacing:.12em}.meter{position:absolute;right:40px;bottom:38px;display:flex;gap:4px;align-items:flex-end;height:17px}.meter span{width:2px;background:#84cefa;opacity:.45;height:4px;transition:height .08s}.flash{position:absolute;inset:0;background:#b4dfff;pointer-events:none;opacity:0}#error{display:none;position:absolute;inset:30%;text-align:center;color:#e9efff} @media(max-width:650px){header{top:25px;left:24px}h1{font-size:32px}.status{top:30px;right:24px;font-size:10px}.corner,.meter{display:none}footer{bottom:24px}.controls{gap:2px}button{padding:12px}#cast{padding:12px 17px}kbd{display:none}.hint{font-size:11px}header p{font-size:12px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Empty dark arena with a branching blue-white lightning spell. Click to cast, or drag to orbit."></canvas>
<header><div class="eyebrow">ELEMENTAL STUDY / 01</div><h1>ARC</h1><p>A lightning spell.</p></header>
<div class="status"><i></i><span id="phase" aria-live="off">READY</span></div>
<footer><div class="controls"><button id="cast">Cast lightning <kbd>SPACE</kbd></button><button id="loop" aria-pressed="false">Loop</button><button id="sound" aria-pressed="true" aria-label="Sound enabled">Sound on</button></div><div class="hint">CLICK TO CAST &nbsp; · &nbsp; DRAG TO ORBIT &nbsp; · &nbsp; SCROLL TO ZOOM</div></footer>
<div class="corner">LIGHTNING ARC &nbsp; / &nbsp; VFX + SFX</div><div class="meter" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="flash" id="flash"></div><div id="error" role="alert"></div>
<script>
'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false});
const phaseLabel=document.querySelector('#phase'),flash=document.querySelector('#flash');
let W=0,H=0,DPR=1,yaw=.32,pitch=.30,distance=18.5,time=0,last=0,castAt=-100,seed=1,loop=false,sound=true,audio=null,audioBuffer=null,voice=null,ready=false;
const origin={x:-5.1,y:1.65,z:0},target={x:4.5,y:.10,z:0};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),mix=(a,b,t)=>a+(b-a)*t;
function randomGenerator(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function project(p){let x=p.x*Math.cos(yaw)-p.z*Math.sin(yaw),z=p.x*Math.sin(yaw)+p.z*Math.cos(yaw),y=p.y-.6;let yy=y*Math.cos(pitch)+z*Math.sin(pitch),zz=-y*Math.sin(pitch)+z*Math.cos(pitch);let scale=Math.min(W/1.45,H*1.48)/(distance+zz);return{x:W*.5+x*scale,y:H*.52-yy*scale,s:scale}}
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
function depth(p){return distance-(p.y-.6)*Math.sin(pitch)+(p.x*Math.sin(yaw)+p.z*Math.cos(yaw))*Math.cos(pitch)}
function line3(points,color,width=1){ctx.beginPath();for(let i=1;i<points.length;i++){let a=points[i-1],b=points[i],da=depth(a),db=depth(b);if(da<1&&db<1)continue;if(da<1||db<1){let t=(1-da)/(db-da),p={x:mix(a.x,b.x,t),y:mix(a.y,b.y,t),z:mix(a.z,b.z,t)};if(da<1)a=p;else b=p}let pa=project(a),pb=project(b);ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y)}ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function glow(x,y,r,color,alpha=1){if(r<=0||alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(.13,color);g.addColorStop(1,'rgba(30,100,255,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore()}
function ring(center,r,color,width=1){let pts=[];for(let i=0;i<=80;i++){let a=i/80*Math.PI*2;pts.push({x:center.x+Math.cos(a)*r,y:center.y,z:center.z+Math.sin(a)*r})}line3(pts,color,width)}
function ground(t,energy){ctx.fillStyle='#050911';ctx.fillRect(0,0,W,H);let bg=ctx.createRadialGradient(W*.56,H*.47,0,W*.56,H*.48,W*.65);bg.addColorStop(0,'#102235');bg.addColorStop(.48,'#09121f');bg.addColorStop(1,'#03060b');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.save();for(let i=-24;i<=24;i++){let alpha=.085*(1-Math.abs(i)/28);line3([{x:i,y:0,z:-24},{x:i,y:0,z:24}],`rgba(110,163,200,${alpha})`,.6);line3([{x:-24,y:0,z:i},{x:24,y:0,z:i}],`rgba(110,163,200,${alpha})`,.6)}
 ring({x:0,y:.005,z:0},7.5,'#658eb81e');ring({x:0,y:.005,z:0},7.65,'#658eb80b');
 ring({...origin,y:.01},.5,'#78c9ff44');ring({...target,y:.01},.65,'#78c9ff38');
 const o=project(origin);glow(o.x,o.y,25,'rgba(75,155,255,.16)');ctx.fillStyle='#aedfff';ctx.beginPath();ctx.arc(o.x,o.y,1.9,0,7);ctx.fill();
 if(energy>0){let q=project({...target,y:.03});ctx.save();ctx.translate(q.x,q.y);ctx.scale(1,.25);glow(0,0,250*q.s/60,'rgba(55,158,255,.6)',energy);ctx.restore();let q2=project({...origin,y:0});ctx.save();ctx.translate(q2.x,q2.y);ctx.scale(1,.3);glow(0,0,150*q.s/60,'rgba(50,130,255,.3)',energy);ctx.restore()}
 ctx.restore();
}
function pathBetween(a,b,rng,rough=.65,steps=42){let pts=[a];for(let i=1;i<steps;i++){let t=i/steps,e=Math.sin(t*Math.PI);pts.push({x:mix(a.x,b.x,t)+(rng()-.5)*.21,y:mix(a.y,b.y,t)+Math.sin(t*Math.PI)*.42+(rng()-.5)*rough*e,z:mix(a.z,b.z,t)+(rng()-.5)*rough*1.2*e})}pts.push(b);return pts}
let paths=[],sparks=[],lastBolt=-1;
function makeBolt(frame){let rng=randomGenerator(seed*99+frame*137);paths=[];let main=pathBetween(origin,target,rng);paths.push({points:main,power:1});
 for(let k=0;k<14;k++){let start=main[5+Math.floor(rng()*32)],dir=rng()<.5?-1:1;let end={x:start.x+.4+rng()*1.8,y:Math.max(.03,start.y+dir*(.4+rng()*1.25)),z:start.z+(rng()-.5)*2};let branch=pathBetween(start,end,rng,.6,9+Math.floor(rng()*7));paths.push({points:branch,power:.20+rng()*.28});if(k%2===0){let fork=branch[4];paths.push({points:pathBetween(fork,{x:fork.x+rng(),y:fork.y+(rng()-.5)*1.1,z:fork.z+.4},rng,.35,7),power:.15})}}
 for(let k=0;k<2;k++)paths.push({points:pathBetween(origin,target,rng,.36+k*.2,48),power:.32});
}
function paintBolt(alpha,reveal=1){ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineJoin='round';ctx.lineCap='round';for(let pass=0;pass<4;pass++){for(let path of paths){let pts=path.points.slice(0,Math.max(2,Math.ceil(path.points.length*reveal)));let a=alpha*path.power;const colors=[`rgba(37,91,255,${a*.07})`,`rgba(46,136,255,${a*.17})`,`rgba(116,209,255,${a*.65})`,`rgba(232,250,255,${a})`];let widths=[23,10,3.8,1.4];line3(pts,colors[pass],widths[pass]*(.35+path.power*.65)*Math.min(1.2,W/1100+.2))}}ctx.restore()}
function initSparks(){let rng=randomGenerator(seed*41);sparks=[];for(let i=0;i<115;i++){let impact=i<70,base=impact?target:origin;let a=rng()*Math.PI*2,v=(impact?1:1.5)+rng()*5;sparks.push({x:base.x,y:base.y,z:base.z,vx:Math.cos(a)*v,vy:1+rng()*5,vz:Math.sin(a)*v,life:.18+rng()*1.0,size:.4+rng()*1.1})}}
function paintSparks(t){ctx.save();ctx.globalCompositeOperation='lighter';for(let p of sparks){if(t<0||t>p.life)continue;let age=t,alpha=(1-age/p.life)**1.3;let point={x:p.x+p.vx*age,y:Math.max(.01,p.y+p.vy*age-5*age*age),z:p.z+p.vz*age};let prev={x:point.x-p.vx*.025,y:Math.max(.01,point.y-(p.vy-10*age)*.025),z:point.z-p.vz*.025};line3([prev,point],`rgba(156,219,255,${alpha})`,p.size);let q=project(point);glow(q.x,q.y,5,'rgba(71,156,255,.2)',alpha)}ctx.restore()}
function charging(t){let progress=clamp(t/.38),rng=randomGenerator(seed);const o=project(origin);ctx.save();ctx.globalCompositeOperation='lighter';glow(o.x,o.y,20+progress*85,'rgba(47,118,255,.35)',progress);glow(o.x,o.y,4+progress*11,'rgba(192,238,255,.9)',progress);for(let i=0;i<27;i++){let a=rng()*Math.PI*2+t*(i%2?2:-2),r=(.25+rng()*1.25)*(1-progress*.86);let p={x:origin.x+Math.cos(a)*r,y:origin.y+Math.sin(a)*r,z:Math.sin(a*2)*r*.6};let q=project(p);glow(q.x,q.y,3,'rgba(158,222,255,.6)',progress);if(i%7===0){let end={x:origin.x+Math.cos(a)*r*.3,y:origin.y+Math.sin(a)*r*.3,z:0};line3(pathBetween(p,end,rng,.18,6),`rgba(139,206,255,${progress*.65})`,.8)}}ctx.restore()}
// Shared deterministic synthesis: charge, electrical snap, tearing arcs and low thunder.
function synthesize(rate){const length=Math.floor(rate*2.4),data=new Float32Array(length),rng=randomGenerator(7821);let low=0,mid=0,ph=0;for(let i=0;i<length;i++){let t=i/rate,n=rng()*2-1;low+=.014*(n-low);mid+=.25*(n-mid);let value=0;if(t<.39){let e=(t/.39)**1.6;ph+=2*Math.PI*(130+t*t*9000)/rate;value+=(Math.sin(ph)*.14+Math.sin(ph*2.017)*.035+n*.03)*e}let d=t-.39;if(d>=0){let snap=Math.exp(-d*65);let arc=Math.exp(-d*5.2)*(0.5+0.5*Math.sin(d*195)**6);let rumble=Math.exp(-d*2.7)*(1-Math.exp(-d*70));value+=(n-mid)*snap*.85+mid*arc*.75+low*rumble*2.7+Math.sin(2*Math.PI*(58*d-12*d*d))*rumble*.20;for(let at of [.09,.19,.31]){let q=d-at;if(q>=0)value+=(n-mid)*Math.exp(-q*95)*.23}}data[i]=Math.tanh(value*1.35)*.73*Math.min(1,t*150,Math.max(0,(2.4-t)*10))}return data}
async function startAudio(){if(!sound)return;try{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();audioBuffer=audio.createBuffer(1,Math.floor(audio.sampleRate*2.4),audio.sampleRate);audioBuffer.copyToChannel(synthesize(audio.sampleRate),0)}if(audio.state==='suspended')await audio.resume();if(voice){try{voice.stop()}catch{}}voice=audio.createBufferSource();voice.buffer=audioBuffer;let gain=audio.createGain();gain.gain.value=.7;voice.connect(gain).connect(audio.destination);voice.start()}catch(e){document.querySelector('#sound').textContent='Audio unavailable';console.error(e)}}
function cast(withAudio=true){if(time-castAt<.7)return;castAt=time;seed++;lastBolt=-1;initSparks();if(withAudio)startAudio();ready=true}
function animate(ms){requestAnimationFrame(animate);time=ms/1000;let age=time-castAt;if(loop&&age>3.2&&!document.hidden){cast();age=0}let strike=age-.39,active=strike>=0&&strike<.65;let envelope=active?Math.exp(-strike*3.0)*(.72+.28*Math.sin(strike*96)**2):0;
 ground(time,envelope);ctx.save();if(active){let shake=Math.exp(-strike*18)*3;ctx.translate(Math.sin(time*120)*shake,Math.cos(time*139)*shake*.5)}
 if(age>=0&&age<.39)charging(age);if(active){let frame=Math.floor(strike*24);if(frame!==lastBolt){makeBolt(frame);lastBolt=frame}paintBolt(envelope,clamp(strike/.035));let q=project(target),o=project(origin);ctx.globalCompositeOperation='lighter';glow(q.x,q.y,125,'rgba(57,132,255,.3)',envelope);glow(q.x,q.y,20,'rgba(181,230,255,.85)',envelope);glow(o.x,o.y,70,'rgba(61,145,255,.4)',envelope);glow(o.x,o.y,10,'rgba(224,248,255,.95)',envelope);ctx.globalCompositeOperation='source-over'}
 if(strike>=0&&strike<1.6){paintSparks(strike);ring({...target,y:.025},.15+strike*3.4,`rgba(109,195,255,${Math.exp(-strike*5)*.45})`,1.3)}ctx.restore();
 // A soft vignette keeps the empty arena quiet and the strike legible.
 let vignette=ctx.createRadialGradient(W*.5,H*.5,Math.min(W,H)*.25,W*.5,H*.5,Math.max(W,H)*.65);vignette.addColorStop(0,'#00000000');vignette.addColorStop(1,'#01040acc');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
 flash.style.opacity=strike>=0&&strike<.06?String((1-strike/.06)*.13):'0';let phase=age<0?'READY':age<.39?'CHARGING':age<1.04?'DISCHARGE':age<2?'DISSIPATING':'READY';if(phaseLabel.textContent!==phase)phaseLabel.textContent=phase;document.querySelectorAll('.meter span').forEach((bar,i)=>{bar.style.height=(3+(age<2&&age>=0?Math.abs(Math.sin(time*25+i*2))*13*(age<.4?age/.4:Math.exp(-(age-.4)*2)):0))+'px'});last=time;
}
document.querySelector('#cast').addEventListener('click',()=>cast());
document.querySelector('#loop').addEventListener('click',e=>{loop=!loop;e.currentTarget.setAttribute('aria-pressed',loop);if(loop&&time-castAt>1)cast()});
document.querySelector('#sound').addEventListener('click',e=>{sound=!sound;e.currentTarget.setAttribute('aria-pressed',sound);e.currentTarget.setAttribute('aria-label',sound?'Sound enabled':'Sound disabled');e.currentTarget.textContent=sound?'Sound on':'Sound off';if(!sound&&voice){try{voice.stop()}catch{}}if(sound&&audio?.state==='suspended')audio.resume()});
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!/BUTTON|INPUT/.test(document.activeElement.tagName)){e.preventDefault();cast()}});
let drag=null;canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:0};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);yaw-=dx*.005;pitch=clamp(pitch+dy*.004,.12,.85);drag.x=e.clientX;drag.y=e.clientY});canvas.addEventListener('pointerup',()=>{if(drag&&drag.moved<7)cast();drag=null});canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();distance=clamp(distance+e.deltaY*.01,13,30)},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&voice){try{voice.stop()}catch{}}});
window.arc={cast,stats:()=>({phase:phaseLabel.textContent,audioState:audio?.state||'not started',audioSamples:audioBuffer?.length||0,paths:paths.length,particles:sparks.length,loop,sound}),synthesize};
requestAnimationFrame(animate);setTimeout(()=>cast(false),700);
</script>
</body></html>
