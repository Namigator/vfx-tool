<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A 2x2 flipbook sheet: four frames of one burst (spark, flare, blast, ring). -->
  <defs>
    <radialGradient id="hot">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.25" stop-color="#ffd0f0"/>
      <stop offset="0.55" stop-color="#ff3fbf" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff3fbf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="40" fill="#3d3d3f"/>
  <rect x="40" y="40" width="432" height="432" rx="6" fill="#000"/>
  <path d="M256 40V472M40 256H472" stroke="#3d3d3f" stroke-width="8"/>
  <!-- frame 1: spark -->
  <circle cx="148" cy="148" r="34" fill="url(#hot)"/>
  <!-- frame 2: flare -->
  <circle cx="364" cy="148" r="62" fill="url(#hot)"/>
  <path d="M364 96V200M312 148H416M327 111l74 74M401 111l-74 74" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <!-- frame 3: blast -->
  <circle cx="148" cy="364" r="96" fill="url(#hot)"/>
  <path d="M148 272V456M56 364H240M83 299l130 130M213 299 83 429" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <!-- frame 4: ring and embers -->
  <circle cx="364" cy="364" r="70" fill="none" stroke="#ff3fbf" stroke-width="10" opacity="0.9"/>
  <circle cx="364" cy="364" r="70" fill="none" stroke="#ffd0f0" stroke-width="3"/>
  <circle cx="318" cy="318" r="6" fill="#ffd0f0"/>
  <circle cx="420" cy="338" r="5" fill="#ff8fdc"/>
  <circle cx="392" cy="420" r="6" fill="#ffd0f0"/>
  <circle cx="330" cy="404" r="4" fill="#ff8fdc"/>
</svg>
